name: Synchroniser les calendriers et publier

on:
  push:
    branches: ["main"]
  issues:
    types: [opened, edited, closed, reopened]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: ma3e-publication
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'issues' || github.actor == github.repository_owner }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer l’application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchroniser le calendrier Apple
        if: github.event_name != 'issues'
        env:
          APPLE_CALENDAR_URL: ${{ secrets.APPLE_CALENDAR_URL }}
        run: node sync-calendar.mjs

      - name: Synchroniser l’emploi du temps ÉcoleDirecte
        if: github.event_name != 'issues'
        env:
          CALENDAR_MODE: timetable
          CALENDAR_URL: ${{ secrets.ECOLEDIRECTE_ICAL_URL }}
          CALENDAR_OUTPUT: timetable.json
        run: node sync-calendar.mjs

      - name: Publier les ressources communes
        if: github.event_name != 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node sync-resources.mjs

      - name: Publier les données temps réel
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch origin live-data:live-data
            git worktree add /tmp/ma3e-live-branch live-data
          else
            git worktree add --detach /tmp/ma3e-live-branch
            cd /tmp/ma3e-live-branch
            git checkout --orphan live-data
            git rm -rf . || true
            cd - >/dev/null
          fi
          copy_if_changed() {
            source_file="$1"
            target_file="/tmp/ma3e-live-branch/$1"
            if [ ! -f "$target_file" ] || ! diff -q <(jq -S 'del(.updatedAt)' "$source_file") <(jq -S 'del(.updatedAt)' "$target_file") >/dev/null; then
              cp "$source_file" "$target_file"
            fi
          }
          if [ "${{ github.event_name }}" = "issues" ]; then
            copy_if_changed resources.json
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            copy_if_changed calendar.json
            copy_if_changed timetable.json
          else
            copy_if_changed calendar.json
            copy_if_changed timetable.json
            copy_if_changed resources.json
          fi
          cd /tmp/ma3e-live-branch
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des données de la classe"
            git push origin HEAD:live-data
          fi

      - name: Préparer GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier le site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
