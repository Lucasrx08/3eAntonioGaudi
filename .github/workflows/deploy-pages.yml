name: Synchroniser les calendriers et publier

on:
  push:
    branches: ["main"]
  issues:
    types: [opened, edited, closed, reopened]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: ma3e-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer l’application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchroniser le calendrier Apple
        if: github.event_name != 'issues'
        env:
          APPLE_CALENDAR_URL: ${{ secrets.APPLE_CALENDAR_URL }}
        run: node sync-calendar.mjs

      - name: Synchroniser l’emploi du temps ÉcoleDirecte
        if: github.event_name != 'issues'
        env:
          CALENDAR_MODE: timetable
          CALENDAR_URL: ${{ secrets.ECOLEDIRECTE_ICAL_URL }}
          CALENDAR_OUTPUT: timetable.json
        run: node sync-calendar.mjs

      - name: Publier les ressources communes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node sync-resources.mjs

      - name: Publier les données temps réel
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/ma3e-live
          cp calendar.json timetable.json resources.json /tmp/ma3e-live/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch origin live-data:live-data
            git worktree add /tmp/ma3e-live-branch live-data
          else
            git worktree add --detach /tmp/ma3e-live-branch
            cd /tmp/ma3e-live-branch
            git checkout --orphan live-data
            git rm -rf . || true
            cd - >/dev/null
          fi
          rm -rf /tmp/ma3e-live-branch/*
          cp /tmp/ma3e-live/*.json /tmp/ma3e-live-branch/
          cd /tmp/ma3e-live-branch
          git add calendar.json timetable.json resources.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des données de la classe"
            git push origin HEAD:live-data
          fi

      - name: Préparer GitHub Pages
        if: github.event_name != 'issues'
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        if: github.event_name != 'issues'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier le site
        if: github.event_name != 'issues'
        id: deployment
        uses: actions/deploy-pages@v4
